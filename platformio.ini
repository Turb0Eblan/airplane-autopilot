; Прошивки автопилота самолёта
;   pio run -e nano          — Arduino Nano (ATmega328P), на основе PilotExtended
;   pio run -e stm32         — STM32F103C8 (Blue Pill), на основе STM32Plane
;   pio run -e nano -t upload

[platformio]
default_envs = nano, stm32

[common]
lib_deps =
    mikalhart/TinyGPSPlus@^1.0.3
    adafruit/Adafruit BNO055@^1.6.3
    adafruit/Adafruit Unified Sensor@^1.1.14
    arduino-libraries/SD@^1.3.0

[env:nano]
platform = atmelavr@5.3.0
; Китайские клоны обычно со старым загрузчиком.
; Если прошивка не заливается — поменяйте на nanoatmega328new
board = nanoatmega328
framework = arduino
build_src_filter = +<nano/>
monitor_speed = 115200
lib_deps =
    ${common.lib_deps}
    arduino-libraries/Servo@^1.2.2
    ; Замена SoftwareSerial: не блокирует прерывания на время приёма байта,
    ; поэтому импульсы Servo больше не «плывут» при приходе данных с GPS
    slashdevin/NeoSWSerial@^3.0.5

[env:stm32]
platform = ststm32@20.0.0
board = bluepill_f103c8
framework = arduino
build_src_filter = +<stm32/>
monitor_speed = 115200
upload_protocol = stlink
lib_deps =
    ${common.lib_deps}
